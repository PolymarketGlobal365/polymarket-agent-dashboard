<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1440 Fixed</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #0b0b0b;
        color: #ffffff;
      }

      .shell {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(18, 18, 18, 0.95);
        backdrop-filter: blur(12px);
      }

      .title {
        font-size: 14px;
        font-weight: 600;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        background: #ffffff;
        color: #000000;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }

      .content {
        width: min(100%, 1480px);
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .page-image {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 18px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="title">1440 Fixed</div>
        <div class="actions">
          <a class="button" href="./1440-Fixed.pdf" target="_blank" rel="noopener noreferrer">원본 PDF 열기</a>
          <a class="button" href="./1440-Fixed.pdf" download>PDF 다운로드</a>
        </div>
      </div>

      <div class="content">
        <img class="page-image" src="./pages/page-001.jpg" alt="1440 Fixed page 1" />
      </div>
    </div>
  </body>
</html>
