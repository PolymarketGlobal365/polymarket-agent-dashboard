    <text x="82" y="218" fill="#99A3B3" font-family="Pretendard, Noto Sans KR, Inter, sans-serif" font-size="22" font-weight="500" text-anchor="start">영상의 흐름을 시작, 전개, 전환, 마무리까지 서사적으로 설계합니다</text>
