      <text x="714" y="920" fill="#F5F7FA" font-family="Pretendard, Noto Sans KR, Inter, sans-serif" font-size="20" font-weight="600" text-anchor="start">15초 / 30초 / 60초 기준으로 유연하게 확장</text>
      <text x="1312" y="920" fill="#F5F7FA" font-family="Pretendard, Noto Sans KR, Inter, sans-serif" font-size="20" font-weight="600" text-anchor="start">컷, 디졸브, 매치컷을 혼합해 리듬 설계</text>
    
