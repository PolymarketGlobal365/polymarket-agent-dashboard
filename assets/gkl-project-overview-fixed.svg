<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d9eefc"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f4aa8"/>
      <stop offset="100%" stop-color="#14377a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd84b"/>
      <stop offset="100%" stop-color="#f4b400"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f59e0b"/>
    </marker>
    <style>
      .kr { font-family: "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
      .title-main { font-size: 44px; font-weight: 800; fill: #ffffff; }
      .title-sub { font-size: 42px; font-weight: 800; fill: #ffd84b; }
      .section-title { font-size: 28px; font-weight: 800; fill: #ffffff; }
      .headline { font-size: 30px; font-weight: 700; fill: #111827; }
      .headline-accent { fill: #c2410c; }
      .box-title { font-size: 26px; font-weight: 800; fill: #123b7a; }
      .box-text { font-size: 19px; font-weight: 700; fill: #1f2937; }
      .small-label { font-size: 18px; font-weight: 700; fill: #374151; }
      .bullet { font-size: 18px; font-weight: 700; fill: #111827; }
      .bottom-title { font-size: 24px; font-weight: 800; fill: #ffffff; }
      .bottom-text { font-size: 18px; font-weight: 700; fill: #123b7a; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <path d="M405 55 Q800 -10 1195 55 L1160 205 Q800 250 440 205 Z" fill="url(#navy)"/>
    <path d="M500 140 Q800 110 1100 140 L1070 228 Q800 250 530 228 Z" fill="#1d4ed8"/>
  </g>
  <text x="800" y="120" text-anchor="middle" class="kr title-main">우리동네 문화유산 여행</text>
  <text x="800" y="190" text-anchor="middle" class="kr title-sub">AI 콘텐츠 트립메이커</text>

  <line x1="90" y1="275" x2="1510" y2="275" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 6"/>
  <g filter="url(#shadow)">
    <rect x="610" y="248" width="380" height="58" rx="12" fill="url(#navy)"/>
  </g>
  <text x="800" y="286" text-anchor="middle" class="kr section-title">프로젝트 비전 · 목표</text>

  <g filter="url(#shadow)">
    <rect x="120" y="330" width="1360" height="92" rx="24" fill="#ffffff"/>
  </g>
  <text x="800" y="390" text-anchor="middle" class="kr headline">
    지역 문화유산을
    <tspan class="headline-accent"> AI 콘텐츠</tspan>
    로 전환하여
    <tspan class="headline-accent"> 관광객 유입 및 지역 활성화</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="70" y="455" width="1460" height="290" rx="28" fill="#ffffff"/>
  </g>

  <g>
    <rect x="95" y="485" width="250" height="210" rx="22" fill="#eef6ff" stroke="#93c5fd"/>
    <text x="220" y="525" text-anchor="middle" class="kr box-title">문화유산·명소</text>
    <text x="220" y="565" text-anchor="middle" class="kr box-title">발굴 및 촬영</text>
    <rect x="125" y="595" width="190" height="70" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="220" y="638" text-anchor="middle" class="kr box-text">지역 현장 촬영</text>
  </g>

  <line x1="345" y1="590" x2="405" y2="590" stroke="#f59e0b" stroke-width="8" marker-end="url(#arrowOrange)"/>

  <g>
    <rect x="405" y="485" width="250" height="210" rx="22" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="530" y="525" text-anchor="middle" class="kr box-title">AI 숏폼</text>
    <text x="530" y="565" text-anchor="middle" class="kr box-title">맞춤형 콘텐츠 제작</text>
    <rect x="435" y="595" width="190" height="70" rx="12" fill="#fff7db" stroke="#f59e0b"/>
    <text x="530" y="638" text-anchor="middle" class="kr box-text">기획 · 편집 · 제작</text>
  </g>

  <line x1="655" y1="590" x2="715" y2="590" stroke="#3b82f6" stroke-width="8" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="715" y="485" width="250" height="210" rx="22" fill="#ecfccb" stroke="#84cc16"/>
    <text x="840" y="525" text-anchor="middle" class="kr box-title">맞춤 콘텐츠 제공</text>
    <text x="840" y="620" text-anchor="middle" class="kr box-text">지자체 · 관광업체</text>
    <text x="840" y="650" text-anchor="middle" class="kr box-text">체험 운영자</text>
  </g>

  <line x1="965" y1="590" x2="1025" y2="590" stroke="#22c55e" stroke-width="8" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="1025" y="485" width="250" height="210" rx="22" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="1150" y="525" text-anchor="middle" class="kr box-title">SNS · 온라인 홍보</text>
    <text x="1150" y="620" text-anchor="middle" class="kr box-text">홍보 콘텐츠 운영</text>
    <text x="1150" y="650" text-anchor="middle" class="kr box-text">캠페인 실행</text>
  </g>

  <line x1="1275" y1="590" x2="1335" y2="590" stroke="#06b6d4" stroke-width="8" marker-end="url(#arrowOrange)"/>

  <g>
    <rect x="1335" y="485" width="170" height="210" rx="22" fill="#fff7ed" stroke="#fb923c"/>
    <text x="1420" y="525" text-anchor="middle" class="kr box-title">수익 창출</text>
    <circle cx="1370" cy="585" r="6" fill="#f59e0b"/>
    <circle cx="1370" cy="625" r="6" fill="#f59e0b"/>
    <circle cx="1370" cy="665" r="6" fill="#f59e0b"/>
    <text x="1385" y="592" class="kr bullet">콘텐츠 제작비</text>
    <text x="1385" y="632" class="kr bullet">홍보 운영비</text>
    <text x="1385" y="672" class="kr bullet">후속 프로젝트</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M250 785 H1350 L1290 840 H310 Z" fill="url(#navy)"/>
  </g>
  <text x="800" y="823" text-anchor="middle" class="kr bottom-title">지자체 · 관광업체 맞춤형 관광 솔루션 제공</text>

  <g filter="url(#shadow)">
    <rect x="270" y="860" width="1060" height="190" rx="28" fill="#ffffff"/>
  </g>

  <line x1="535" y1="890" x2="535" y2="1025" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="800" y1="890" x2="800" y2="1025" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1065" y1="890" x2="1065" y2="1025" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="6 6"/>

  <g>
    <rect x="320" y="910" width="70" height="52" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <polygon points="332,922 332,950 378,936" fill="#1d4ed8"/>
    <text x="400" y="1005" text-anchor="middle" class="kr bottom-text">숏폼 콘텐츠 제작</text>
  </g>

  <g>
    <rect x="590" y="905" width="58" height="58" rx="12" fill="#fee2e2" stroke="#f97316"/>
    <text x="619" y="944" text-anchor="middle" class="kr box-text" style="font-size:34px; fill:#ea580c;">@</text>
    <text x="665" y="1005" text-anchor="middle" class="kr bottom-text">온라인 홍보</text>
  </g>

  <g>
    <rect x="855" y="915" width="82" height="48" rx="8" fill="#ecfccb" stroke="#84cc16"/>
    <circle cx="870" cy="972" r="8" fill="#ef4444"/>
    <circle cx="924" cy="972" r="8" fill="#ef4444"/>
    <line x1="870" y1="972" x2="896" y2="936" stroke="#ef4444" stroke-width="4"/>
    <line x1="924" y1="972" x2="896" y2="936" stroke="#ef4444" stroke-width="4"/>
    <text x="930" y="1005" text-anchor="middle" class="kr bottom-text">체험 연계</text>
  </g>

  <g>
    <rect x="1120" y="908" width="78" height="58" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
    <rect x="1132" y="940" width="10" height="16" fill="#0284c7"/>
    <rect x="1148" y="932" width="10" height="24" fill="#0ea5e9"/>
    <rect x="1164" y="922" width="10" height="34" fill="#38bdf8"/>
    <rect x="1180" y="914" width="10" height="42" fill="#7dd3fc"/>
    <text x="1198" y="1005" text-anchor="middle" class="kr bottom-text">성과 분석 컨설팅</text>
  </g>
</svg>
